name: Daily Sync from Surge

on:
  schedule:
    # 每日 03:00 UTC = 北京时间 11:00：同步源站 + 生成每日资讯数据
    - cron: '0 3 * * *'
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write

concurrency:
  group: daily-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download site from mednotes-cn.surge.sh (skip locally-maintained files)
        run: |
          set -e
          BASE="https://mednotes-cn.surge.sh"
          # 本地修复/维护的文件以仓库为准，不覆盖（index.html 因维护缓存版本号纳入保护）：
          PROTECTED="index.html css/style.css js/app.js js/utils.js js/sync.js js/modules/focus.js js/modules/papers.js js/modules/mednews.js js/modules/briefing.js js/modules/space.js .github/workflows/daily-sync.yml scripts data"
          FILES="index.html css/style.css js/app.js js/utils.js js/storage.js js/sync.js js/modules/focus.js js/modules/papers.js js/modules/mednews.js js/modules/briefing.js js/modules/space.js"
          for f in $FILES; do
            skip=0
            for p in $PROTECTED; do
              if [ "$f" = "$p" ]; then skip=1; echo "skip (locally maintained): $f"; break; fi
            done
            [ $skip -eq 1 ] && continue
            mkdir -p "$(dirname "$f")"
            curl -fsSL --max-time 30 "$BASE/$f" -o "$f"
            echo "synced: $f ($(wc -c < "$f") bytes)"
          done

      - name: Generate daily data (papers/mednews/briefing)
        run: |
          set -e
          python3 scripts/gen_data.py data
          ls -la data/

      - name: Commit and push if changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes — 内容无变化，跳过提交"
          else
            git config user.name "mednotes-sync-bot"
            git config user.email "mednotes-sync-bot@users.noreply.github.com"
            git add -A
            git commit -m "chore: daily sync + data refresh ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            # 自动合并远端并发推送（豆包定时任务与 Actions 可能同时执行），避免 push 竞态
            git pull --rebase origin main || true
            git push origin main
            echo "已提交并推送更新，GitHub Pages 将自动重新发布"
          fi
