name: Daily Sync from Surge

on:
  schedule:
    # 每日 03:00 UTC = 北京时间 11:00，自动从 surge.sh 同步最新内容
    - cron: '0 3 * * *'
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write

concurrency:
  group: daily-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download latest site from mednotes-cn.surge.sh
        run: |
          set -e
          BASE="https://mednotes-cn.surge.sh"
          FILES="index.html css/style.css js/app.js js/utils.js js/storage.js js/sync.js js/modules/focus.js js/modules/papers.js js/modules/mednews.js js/modules/briefing.js js/modules/space.js"
          for f in $FILES; do
            mkdir -p "$(dirname "$f")"
            curl -fsSL --max-time 30 "$BASE/$f" -o "$f"
            echo "synced: $f ($(wc -c < "$f") bytes)"
          done
          echo "--- git status ---"
          git status --porcelain || true

      - name: Commit and push if changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes — 内容无变化，跳过提交"
          else
            git config user.name "mednotes-sync-bot"
            git config user.email "mednotes-sync-bot@users.noreply.github.com"
            git add -A
            git commit -m "chore: daily sync from mednotes-cn.surge.sh ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push origin main
            echo "已提交并推送更新，GitHub Pages 将自动重新发布"
          fi
